<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc 
                src="pipe-in/emc.json" 
        ></script>
    </be-hive>
    <article 
        pipe-in=html-spec/multipage
        pipe-in-shadowrootmode=open
        pipe-in-base
        pipe-in-method=streamHTMLUnsafe
        pipe-in-run-scripts
    >
        
    </article>
</body>
</html>
