<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 2</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc 
                src="pipe-in/emc.json" 
        ></script>
    </be-hive>

    <!-- Using streamHTMLUnsafe so the sanitizer doesn't strip <link> and <img> -->
    <!-- Same-origin absolute path — security gate allows unsafe for same-origin -->
    <article 
        pipe-in=/demo/partials/sample.html
        pipe-in-shadowrootmode=open
        pipe-in-base
        pipe-in-method=streamHTMLUnsafe

    >
        <p>Loading...</p>
    </article>
</body>
</html>
